services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: railway
      POSTGRES_USER: railway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-railway}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U railway -d railway"]
      interval: 3s
      timeout: 3s
      retries: 20
  web:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://railway:${POSTGRES_PASSWORD:-railway}@db:5432/railway
      SECRET_KEY: ${SECRET_KEY:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - app-instance:/app/instance
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres-data:
  app-instance:
