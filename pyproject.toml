[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "railway-timetable"
version = "1.0.0"
description = "Flask timetable planner with GTFS imports and whole-train coupling"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "Flask==3.1.3", "Flask-SQLAlchemy==3.1.1", "SQLAlchemy==2.1.9",
  "Flask-WTF==1.2.2", "psycopg[binary]==3.3.9", "alembic==1.20.1",
  "gunicorn==23.0.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.6"]
ui = ["playwright>=1.56,<2"]

[tool.setuptools.packages.find]
include = ["railway*"]

[tool.setuptools.package-data]
railway = ["templates/*.html", "templates/admin/*.html", "static/css/*.css", "static/js/*.js", "migrations/*.py", "migrations/*.mako", "migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
